[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "buenos-aires-airbnb-analysis"
version = "0.1.0"
description = "Exploratory analysis of prices, hosts, and guest reviews in the Buenos Aires Airbnb market."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Nazareno Urday" }]
dependencies = [
    "matplotlib>=3.11,<4",
    "numpy>=2.5,<3",
    "pandas>=3.1,<4",
    "pyarrow>=26",
    "scipy>=1.18,<2",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.4,<8",
    "jupyterlab>=4.6,<5",
]

# The analysis lives in the notebooks, so there is no package to install.
[tool.setuptools]
packages = []
